version: '3.8'

services:
  gateway-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-shield-gateway
    restart: always
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - SUPABASE_DB_URL=${SUPABASE_DB_URL:-}
      - DODO_PAYMENTS_API_KEY=${DODO_PAYMENTS_API_KEY:-}
      - DODO_WEBHOOK_SECRET=${DODO_WEBHOOK_SECRET:-}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
    resources:
      limits:
        memory: 64M
        cpus: '0.5'
